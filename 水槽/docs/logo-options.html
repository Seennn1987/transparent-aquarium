<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ロゴ案 • ReSwim</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="stylesheet" href="../ui/tokens.css" />
    <style>
      body { padding: var(--space-8) var(--space-6) var(--space-16); }
      header { max-width: 1200px; margin: 0 auto var(--space-8); }
      h1 { margin: 0 0 var(--space-2); font-size: var(--text-brand); font-weight: 600; }
      header p { margin: 0; color: var(--text-muted); font-size: var(--text-body); }
      .grid {
        max-width: 1200px; margin: 0 auto;
        display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-6);
      }
      .option {
        margin: 0; padding: var(--space-4);
        background: var(--surface); border: var(--stroke) solid var(--border); border-radius: 12px;
      }
      .main {
        display: flex; align-items: center; justify-content: center;
        aspect-ratio: 1; background: #000; border-radius: 8px; overflow: hidden;
      }
      .main img { width: 100%; height: 100%; object-fit: contain; display: block; }
      figcaption { margin-top: var(--space-4); }
      figcaption h2 { margin: 0 0 var(--space-1); font-size: 16px; font-weight: 600; }
      figcaption p { margin: 0 0 var(--space-4); color: var(--text-muted); font-size: var(--text-body); line-height: 1.6; }
      .small {
        display: flex; align-items: center; gap: var(--space-6);
        padding: var(--space-3); background: var(--background); border-radius: 8px;
        color: var(--text-muted); font-size: var(--text-small);
      }
      .small span { display: flex; align-items: center; gap: var(--space-2); }
      .small .header-size { height: 40px; width: auto; }
      .small .tab-size {
        width: 32px; height: 32px; object-fit: cover;
        object-position: var(--mark, center); border-radius: 6px;
      }
      @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1>ReSwim ロゴ案</h1>
      <p>「ReSwim」透明標本に命を吹き込む ― 生成した4案と、見出し・タブアイコン相当に縮めたときの見え方</p>
    </header>
    <main class="grid">
      <figure class="option" style="--mark: 14% 50%">
        <div class="main"><img src="images/logo-options/reswim_logo_A_line.png" alt="A案 ライン＋横組み" /></div>
        <figcaption>
          <h2>A案 ライン＋横組み</h2>
          <p>タブアイコンと同じ魚に、細いゴシックの ReSwim を横に並べた案。サイト見出しに一番入れやすい。</p>
          <div class="small">
            <span><img class="header-size" src="images/logo-options/reswim_logo_A_line.png" alt="" />見出し（高さ40px）</span>
            <span><img class="tab-size" src="images/logo-options/reswim_logo_A_line.png" alt="" />32px</span>
          </div>
        </figcaption>
      </figure>
      <figure class="option" style="--mark: 50% 36%">
        <div class="main"><img src="images/logo-options/reswim_logo_B_jar.png" alt="B案 標本瓶のエンブレム" /></div>
        <figcaption>
          <h2>B案 標本瓶のエンブレム</h2>
          <p>金線の瓶の中で透明標本の魚が泡をまとう図柄。博物館のような高級感。細い線が多く、小さいと潰れやすい。</p>
          <div class="small">
            <span><img class="header-size" src="images/logo-options/reswim_logo_B_jar.png" alt="" />見出し（高さ40px）</span>
            <span><img class="tab-size" src="images/logo-options/reswim_logo_B_jar.png" alt="" />32px</span>
          </div>
        </figcaption>
      </figure>
      <figure class="option" style="--mark: 14% 45%">
        <div class="main"><img src="images/logo-options/reswim_logo_C_wordmark.png" alt="C案 文字だけのロゴ" /></div>
        <figcaption>
          <h2>C案 文字だけのロゴ</h2>
          <p>R の脚が魚の背骨に、i の点が魚の目になった文字ロゴ。ピンクから水色へのグラデーションで、ポップで覚えやすい。</p>
          <div class="small">
            <span><img class="header-size" src="images/logo-options/reswim_logo_C_wordmark.png" alt="" />見出し（高さ40px）</span>
            <span><img class="tab-size" src="images/logo-options/reswim_logo_C_wordmark.png" alt="" />32px</span>
          </div>
        </figcaption>
      </figure>
      <figure class="option" style="--mark: 50% 40%">
        <div class="main"><img src="images/logo-options/reswim_logo_D_glass.png" alt="D案 ガラスの魚と光の輪" /></div>
        <figcaption>
          <h2>D案 ガラスの魚と光の輪</h2>
          <p>ガラス細工のように透ける魚を、光の輪（もう一度泳ぐ）で囲んだ案。幻想的で、トップのキービジュアル向き。</p>
          <div class="small">
            <span><img class="header-size" src="images/logo-options/reswim_logo_D_glass.png" alt="" />見出し（高さ40px）</span>
            <span><img class="tab-size" src="images/logo-options/reswim_logo_D_glass.png" alt="" />32px</span>
          </div>
        </figcaption>
      </figure>
    </main>
  </body>
</html>
