<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2b231d" />
    <meta
      name="description"
      content="透明標本ケースの観察ページ。白いガラスの台に並んだ標本瓶のギャラリーで、手前の瓶の標本を見る。"
    />
    <title>Specimen Case • ReSwim</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three.module.js",
          "three/addons/": "../../vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <main id="habitat" aria-label="透明標本ケースの観察">
      <canvas
        id="scene"
        aria-label="白いガラスの台に並んだ標本瓶のギャラリー。手前の瓶にピントが合っている。ドラッグで回し、ホイールでズーム。"
        tabindex="0"
      ></canvas>
      <!-- 2026-10-24 プロデューサー「Reswimのロゴは消して。」: 左上のロゴ（ホームへのリンク）を外した -->
      <footer class="chrome" aria-label="操作">
        <div class="buttons">
          <button disabled id="pause" aria-pressed="false" title="Space">Pause</button>
          <button disabled id="fullscreen" title="F">Fullscreen</button>
        </div>
        <div class="preferences">
          <select disabled id="stage" aria-label="台" title="T">
            <option value="blocks">光る台</option>
            <option value="white" selected>白ガラス</option>
            <option value="black">黒ガラス</option>
          </select>
          <select disabled id="wall" aria-label="壁" title="W">
            <option value="wood">木の壁</option>
            <option value="white" selected>白い壁</option>
            <option value="black">黒い壁</option>
          </select>
          <select disabled id="quality" aria-label="Quality">
            <option value="eco">Eco</option>
            <option value="balanced">Balanced</option>
            <option value="detail" selected>Detail</option>
          </select>
          <button disabled id="hide" title="H">Hide controls</button>
        </div>
      </footer>
      <button disabled id="show-controls" title="H">Show controls</button>
      <div id="loading" role="status"><p>Loading specimen case…</p></div>
      <div id="error" role="alert" hidden></div>
    </main>
    <script type="module" src="../shared/start.js" data-entry="./src/main.js"></script>
  </body>
</html>
