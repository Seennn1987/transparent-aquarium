<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f2f0" />
    <meta
      name="description"
      content="透明標本ケースの観察ページ。白いスタジオでガラス容器内の標本を見る。"
    />
    <title>Specimen Case • Desktop Habitats</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three.module.js",
          "three/addons/": "../../vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <main id="habitat" aria-label="透明標本ケースの観察">
      <canvas
        id="scene"
        aria-label="白いスタジオに置かれた標本ケース。ドラッグで回し、ホイールでズーム。"
        tabindex="0"
      ></canvas>
      <nav class="chrome" aria-label="ナビゲーション">
        <a class="home-link" href="../../" aria-label="Habitats home">Habitats</a>
      </nav>
      <footer class="chrome" aria-label="操作">
        <div class="buttons">
          <button disabled id="pause" aria-pressed="false" title="Space">Pause</button>
          <button disabled id="fullscreen" title="F">Fullscreen</button>
        </div>
        <div class="preferences">
          <select disabled id="quality" aria-label="Quality">
            <option value="eco">Eco</option>
            <option value="balanced" selected>Balanced</option>
            <option value="detail">Detail</option>
          </select>
          <button disabled id="hide" title="H">Hide controls</button>
        </div>
      </footer>
      <button disabled id="show-controls" title="H">Show controls</button>
      <div id="loading" role="status"><p>Loading specimen case…</p></div>
      <div id="error" role="alert" hidden></div>
    </main>
    <script type="module" src="../shared/start.js" data-entry="./src/main.js"></script>
  </body>
</html>
